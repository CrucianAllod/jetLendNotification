target-version = "py312"
line-length = 88
extend-exclude = [
    ".git",
    ".venv",
    "*/migrations/*",
]

[lint]
select = [
    "B",
    "C4",
    "DJ",
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "RUF",
    "SIM",
    "UP",
    "W",
]
# Кириллица в логах и сообщениях для пользователя — осознанное решение:
# всё, что видит оператор, на русском.
ignore = ["RUF001", "RUF002", "RUF003"]

[lint.isort]
known-first-party = ["config", "notifications"]

[lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]

[format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
